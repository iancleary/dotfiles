# Optional shared work-machine tool selection. Projects may override it.
# Personal tools and services are deliberately outside this profile.
[tools]
ast-grep = "latest"
codex = "latest"
gh = "latest"
go = "1.27"
just = "latest"
neovim = "latest"
"github:can1357/oh-my-pi" = "latest"
node = "26"
pnpm = "12"
python = "3.14"
rust = "latest"
typst = "latest"
uv = "latest"

[settings]
idiomatic_version_file_enable_tools = ["python", "rust"]
lockfile = true

[settings.python]
uv_venv_auto = "source"

[settings.upgrade]
auto_prune = false
