# Shared fast-moving user tools. Host-specific additions live in mise/hosts/.
[tools]
ast-grep = "latest"
basecamp = "latest"
codex = "latest"
gh = "latest"
"github:basecamp/hey-cli" = "latest"
go = "1.27"
herdr = "0.9.1"
neovim = "latest"
node = "26"
pnpm = "12"
stripe = "latest"
typst = "latest"
yt-dlp = "latest"
python = "3.14"
rust = "latest"
uv = "latest"

[settings]
idiomatic_version_file_enable_tools = ["python", "rust"]

[settings.python]
uv_venv_auto = "source"

[dotfiles]
"~/.codex/config.toml/queued_question_keys" = { block = '''
[tui.keymap.chat]
edit_queued_message = "shift-left"
prompt_stack_back = "shift-right"
''' }
